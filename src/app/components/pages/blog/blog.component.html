<section class="blog-hero">
  <div class="app-container">
    <h1 class="marketing-title">Blog Tecnológico</h1>
    <p class="muted">Novedades, guías y mejores prácticas relacionadas con nuestros servicios.</p>
  </div>
</section>

<section class="section">
  <div class="app-container blog-grid">
    @for (post of posts; track post.title) {
        <article class="post-card">
          <img [src]="post.image" [alt]="post.title" loading="lazy" />
          <h3>{{ post.title }}</h3>
          <p class="muted">{{ post.excerpt }}</p>
          <a class="app-action app-action--outline app-action--compact" [routerLink]="['/Blog']">Leer más</a>
        </article>
    } @empty {
        <p class="muted">No hay artículos publicados por el momento.</p>
    }
  </div>
</section>
